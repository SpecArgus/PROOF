[project]
name = "proof-workspace"
version = "0.0.0"
description = "PROOF development workspace"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "jsonschema[format]==4.26.0",
  "pytest==9.1.1",
  "pyyaml==6.0.3",
  "rfc8785==0.1.4",
  "ruff==0.15.22",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
