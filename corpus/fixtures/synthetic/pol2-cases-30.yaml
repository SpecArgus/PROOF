openapi: 3.0.3
info:
  title: AGT-POL-002 corpus cases (OAS 3.0.x, YAML)
  version: 1.0.0
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
paths:
  "/users/{userId}/secrets":
    get:
      operationId: getUserSecrets
      summary: List user secrets
      security: []
      parameters:
        - name: userId
          in: path
          required: true
          description: Stable user identifier.
          schema:
            type: string
      responses:
        "200":
          description: OK
  /admin/roles:
    patch:
      operationId: updateRoles
      summary: Update role assignments
      x-agent-policy:
        confirmation:
          mode: required
          reason: Role changes affect access control.
        authorization:
          roles:
            - admin
      responses:
        "200":
          description: Updated
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
