openapi: 3.1.1
info:
  title: AGT-PARAM-001 corpus cases (OAS 3.1.x, YAML)
  version: 1.0.0
paths:
  /items:
    get:
      operationId: listItems
      summary: List items
      parameters:
        - name: page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
  /catalog:
    get:
      operationId: getCatalog
      summary: Browse the catalog
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
