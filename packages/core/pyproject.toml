[project]
name = "proof-core"
version = "0.1.0"
description = "Deterministic analysis core for PROOF"
requires-python = ">=3.14,<3.15"
dependencies = [
  "pyyaml==6.0.3",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proof_core"]
