[project]
name = "proof-rulepack"
version = "0.1.0"
description = "Built-in Agent contract rules for PROOF"
requires-python = ">=3.14,<3.15"
dependencies = [
  "rfc8785==0.1.4",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proof_rulepack"]
