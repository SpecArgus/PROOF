name: Repository CI

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - edited
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: repository-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PROOF_BASE_REF: ${{ github.base_ref }}
      PROOF_HEAD_REF: ${{ github.head_ref }}
      PROOF_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      PROOF_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PROOF_PR_TITLE: ${{ github.event.pull_request.title }}
      PROOF_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate repository
        shell: pwsh
        run: ./scripts/validate-repository.ps1

      - name: Parse YAML files
        shell: bash
        run: |
          ruby -e '
            require "yaml"
            paths = Dir.glob([".github/**/*.yml", ".github/**/*.yaml"]).sort
            paths.each do |path|
              YAML.safe_load_file(
                path,
                permitted_classes: [],
                permitted_symbols: [],
                aliases: false
              )
              puts "Parsed #{path}"
            end
          '

  contracts:
    name: contracts (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: windows-x64
            runner: windows-2022
          - platform: macos-arm64
            runner: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --all-packages --locked

      - name: Run contract tests
        run: uv run --locked pytest

      - name: Run Python lint
        run: uv run --locked ruff check .

      - name: Build contract package
        run: uv build --package proof-contracts --out-dir .artifacts/contracts

      - name: Build core package
        run: uv build --package proof-core --out-dir .artifacts/core

      - name: Build validator worker package
        run: >-
          uv build --package proof-validator-worker
          --out-dir .artifacts/validator-worker

      - name: Verify packaged schemas
        run: uv run --locked python scripts/verify-contract-package.py .artifacts/contracts
